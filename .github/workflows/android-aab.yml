name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for AAB (e.g., 1.0.0)'
        required: false
        default: ''
        type: string
      upload_to_play_store:
        description: 'Upload to Google Play Store (requires service account)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'

jobs:
  build-aab:
    name: Build AAB Bundle
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Install dependencies
      run: npm ci
      
    - name: Build web application
      run: npm run build
      
    - name: Sync with Capacitor
      run: npx cap sync android
      
    - name: Setup signing
      env:
        ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "Error: RELEASE_KEYSTORE_BASE64 secret not set. AAB requires signing."
          echo ""
          echo "To set up signing for AAB builds:"
          echo "1. Convert your keystore to base64:"
          echo "   base64 -w 0 android/release-key.keystore > keystore.b64"
          echo "2. Go to GitHub repo → Settings → Secrets and variables → Actions"
          echo "3. Click 'New repository secret'"
          echo "4. Name: RELEASE_KEYSTORE_BASE64"
          echo "5. Value: Paste contents of keystore.b64"
          echo ""
          echo "Also add these secrets:"
          echo "- KEYSTORE_PASSWORD: Your keystore password"
          echo "- KEY_PASSWORD: Your key password"
          exit 1
        else
          echo "$ENCODED_KEYSTORE" | base64 -d > android/release-key.keystore
          echo "✅ Keystore decoded successfully"
        fi
        
    - name: Create key.properties
      env:
        STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
          echo "Error: KEYSTORE_PASSWORD and KEY_PASSWORD secrets are required for AAB"
          exit 1
        fi
        
        cat > android/key.properties << EOF
        storePassword=$STORE_PASSWORD
        keyPassword=$KEY_PASSWORD
        keyAlias=tikitapo
        storeFile=release-key.keystore
        EOF
        echo "✅ key.properties created"
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build AAB Bundle
      working-directory: ./android
      run: ./gradlew bundleRelease --stacktrace
      
    - name: Verify AAB exists
      run: |
        if [ ! -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
          echo "❌ Error: AAB file not found after build"
          exit 1
        fi
        ls -lh android/app/build/outputs/bundle/release/app-release.aab
        
    - name: Rename AAB with version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        if [ -z "$VERSION" ]; then
          VERSION="${GITHUB_REF_NAME}"
        fi
        if [ -z "$VERSION" ]; then
          VERSION=$(date +%Y%m%d-%H%M%S)
        fi
        cp android/app/build/outputs/bundle/release/app-release.aab "tikitapo-${VERSION}.aab"
        echo "✅ AAB renamed to: tikitapo-${VERSION}.aab"
        
    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tikitapo-aab-bundle
        path: |
          tikitapo-*.aab
          android/app/build/outputs/bundle/release/app-release.aab
        retention-days: 90
        
    - name: Create GitHub Release with AAB
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          tikitapo-*.aab
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload to Google Play Store
      if: github.event.inputs.upload_to_play_store == 'true'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        packageName: africa.genius.tikitapo
        releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
        track: internal
        status: completed
        whatsNewDirectory: distribution/whatsnew
      continue-on-error: true
      
    - name: Summary
      run: |
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  ✅ AAB Bundle Built Successfully!                        ║"
        echo "╚═══════════════════════════════════════════════════════════╝"
        echo ""
        echo "📦 AAB File: tikitapo-*.aab"
        echo ""
        echo "📋 Next Steps for Google Play Store:"
        echo "   1. Go to https://play.google.com/console"
        echo "   2. Create/select your app"
        echo "   3. Go to Production → Create new release"
        echo "   4. Upload the AAB file"
        echo "   5. Fill in release notes"
        echo "   6. Publish!"
        echo ""
