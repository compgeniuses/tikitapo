<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <merge>
        <mergeNode in="coloredBlur"/>
        <mergeNode in="SourceGraphic"/>
      </merge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="200" r="2" fill="rgba(6, 182, 212, 0.3)"/>
  <circle cx="900" cy="300" r="3" fill="rgba(139, 92, 246, 0.3)"/>
  <circle cx="200" cy="600" r="2" fill="rgba(6, 182, 212, 0.2)"/>
  <circle cx="800" cy="700" r="2" fill="rgba(139, 92, 246, 0.2)"/>
  <circle cx="150" cy="1200" r="3" fill="rgba(6, 182, 212, 0.3)"/>
  <circle cx="950" cy="1300" r="2" fill="rgba(139, 92, 246, 0.3)"/>
  <circle cx="300" cy="1600" r="2" fill="rgba(6, 182, 212, 0.2)"/>
  <circle cx="700" cy="1700" r="3" fill="rgba(139, 92, 246, 0.2)"/>
  
  <!-- Main content centered -->
  <g transform="translate(540, 700)">
    <!-- Main circle -->
    <circle cx="0" cy="0" r="200" fill="url(#circleGradient)" filter="url(#glow)"/>
    
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="3"/>
    
    <!-- T letter -->
    <text x="0" y="70" font-family="Arial, sans-serif" font-size="280" font-weight="900" fill="white" text-anchor="middle" filter="url(#glow)">T</text>
  </g>
  
  <!-- App name -->
  <text x="540" y="1100" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="url(#circleGradient)" text-anchor="middle">tikitapo</text>
  
  <!-- Tagline -->
  <text x="540" y="1180" font-family="Arial, sans-serif" font-size="36" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="4">CONNECT • COMPETE • CONQUER</text>
  
  <!-- Developer credit -->
  <text x="540" y="1750" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#64748b" text-anchor="middle">Developed by</text>
  
  <text x="540" y="1800" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="url(#circleGradient)" text-anchor="middle">Genius.africa</text>
  
  <text x="540" y="1840" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#475569" text-anchor="middle">Innovation • Technology • Excellence</text>
  
</svg>
