<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <merge>
        <mergeNode in="coloredBlur"/>
        <mergeNode in="SourceGraphic"/>
      </merge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGradient)" rx="64" ry="64"/>
  
  <!-- Decorative corner accents -->
  <path d="M 0 64 L 0 0 L 64 0" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="4"/>
  <path d="M 448 0 L 512 0 L 512 64" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="4"/>
  <path d="M 0 448 L 0 512 L 64 512" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="4"/>
  <path d="M 512 448 L 512 512 L 448 512" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="4"/>
  
  <!-- Main circle with gradient -->
  <circle cx="256" cy="240" r="140" fill="url(#circleGradient)" filter="url(#glow)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="256" cy="240" r="120" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  
  <!-- T letter -->
  <text x="256" y="295" font-family="Arial, sans-serif" font-size="180" font-weight="900" fill="white" text-anchor="middle" filter="url(#glow)">T</text>
  
  <!-- Game grid representation (4x4 dots) -->
  <g fill="rgba(255, 255, 255, 0.6)">
    <circle cx="140" cy="400" r="6"/>
    <circle cx="180" cy="400" r="6"/>
    <circle cx="220" cy="400" r="6"/>
    <circle cx="260" cy="400" r="6"/>
    
    <circle cx="140" cy="430" r="6"/>
    <circle cx="180" cy="430" r="6"/>
    <circle cx="220" cy="430" r="6"/>
    <circle cx="260" cy="430" r="6"/>
  </g>
  
  <!-- Connection lines to show the connect game concept -->
  <path d="M 140 400 L 260 400" stroke="rgba(6, 182, 212, 0.5)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 180 430 L 260 430" stroke="rgba(139, 92, 246, 0.5)" stroke-width="3" stroke-linecap="round"/>
  
</svg>
